# Builds, signs, notarizes and publishes Voilà.
#
# Trigger: push a version tag (e.g. `git tag v1.1 && git push origin v1.1`), or run it manually
# from the Actions tab to rebuild an existing tag (e.g. v1.0) and replace its DMG.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   MACOS_CERTIFICATE_P12_BASE64   Developer ID Application certificate + private key (.p12), base64
#   MACOS_CERTIFICATE_PASSWORD     password chosen when exporting the .p12
#   NOTARY_API_KEY_P8_BASE64       App Store Connect API key (.p8), base64
#   NOTARY_API_KEY_ID              its Key ID
#   NOTARY_API_ISSUER_ID           its Issuer ID
#   GOOGLE_OAUTH_CLIENT_JSON       contents of GoogleOAuthClient.json (Desktop OAuth client)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check that all secrets are configured
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEY_P8: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
          OAUTH: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: |
          missing=0
          for name in P12 P12_PASSWORD KEY_P8 KEY_ID ISSUER OAUTH; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name"; missing=1; fi
          done
          exit $missing

      - name: Check that the tag matches the app version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match CFBundleShortVersionString $VERSION in Resources/Info.plist"
            exit 1
          fi

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Import the Developer ID certificate into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write the Google OAuth client and notary key
        env:
          OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$OAUTH_JSON" > GoogleOAuthClient.json
          echo "$KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarize the DMG
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: ./scripts/release.sh

      - name: Verify Gatekeeper acceptance
        run: |
          DMG="dist/Voila-$VERSION.dmg"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"
          xcrun stapler validate "$DMG"
          echo "SHA256=$(shasum -a 256 "$DMG" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="dist/Voila-$VERSION.dmg"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" --title "Voilà $VERSION" --verify-tag --notes "$(printf '%s\n\n%s\n\n%s' \
              "Signed with Developer ID and notarized by Apple: open the DMG and drag **Voilà** to **Applications**. Requires macOS 26 or later (Apple Silicon or Intel)." \
              "SHA-256 \`$SHA256\`" \
              "See the [commit history](https://github.com/${{ github.repository }}/commits/$TAG) for changes.")"
          fi
          echo "Published $DMG (SHA-256 $SHA256) to $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the DMG as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voila-${{ env.VERSION }}-dmg
          path: dist/*.dmg
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f GoogleOAuthClient.json "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"
